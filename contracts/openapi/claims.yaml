openapi: 3.0.4
info:
  title: Chubb Claims API
  version: v1
paths:
  /claims:
    post:
      operationId: SubmitClaim
      summary: Submit a claim (Claimant)
      tags:
        - Claims
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 8 to 128 characters of A-Z, a-z, 0-9, underscore and hyphen. A resend with the same key and bytes returns the stored response.
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]{8,128}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimsSubmitClaimRequest'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created claim.
              schema:
                type: string
            Idempotent-Replayed:
              description: 'true when this is a stored response being replayed.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimsClaimantClaimView'
        '400':
          description: Bad request or validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '403':
          description: The caller's role or the claim state does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '409':
          description: Conflict (domain refusal, or idempotency-request-in-progress with a Retry-After header)
          headers:
            Retry-After:
              description: Seconds to wait before retrying, set for idempotency-request-in-progress.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '413':
          description: Request body above 64 KB
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '422':
          description: Unprocessable request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '500':
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
    get:
      operationId: ListClaims
      summary: List claims (Officer or Manager)
      tags:
        - Claims
      parameters:
        - name: market
          in: query
          schema:
            type: string
            enum: [SG, HK, MY, TH, ID, AU]
        - name: type
          in: query
          schema:
            type: string
            enum: [Motor, Property]
        - name: status
          in: query
          schema:
            type: string
            enum: [Submitted, UnderReview, InfoRequested, PendingDecisionApproval, Approved, Rejected, PendingSettlementApproval, Settling, Settled]
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          description: Defaults to newest, or to oldest (open proposal age, then claim number) when status is PendingDecisionApproval.
          schema:
            type: string
            enum: [newest, oldest]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimsStaffClaimPage'
        '400':
          description: Bad request or validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '403':
          description: The caller's role or the claim state does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '500':
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
  /claims/{id}:
    get:
      operationId: GetClaim
      summary: Read a claim; the view depends on the caller's role
      tags:
        - Claims
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ClaimsClaimantClaimView'
                  - $ref: '#/components/schemas/ClaimsStaffClaimView'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '404':
          description: Claim not found (also for a claim the caller does not own)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '500':
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
  /claims/{id}/timeline:
    get:
      operationId: GetClaimTimeline
      summary: Read the claim progress trail; claimants see Public entries only
      tags:
        - Claims
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: '#/components/schemas/ClaimsClaimantTimelineItem'
                  - type: array
                    items:
                      $ref: '#/components/schemas/ClaimsStaffTimelineEntry'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '404':
          description: Claim not found (also for a claim the caller does not own)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '500':
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
