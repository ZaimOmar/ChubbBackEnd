        '403':
          description: The caller's role or the claim state does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '404':
          description: Claim not found (also for a claim the caller does not own)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '409':
          description: Conflict (domain refusal, or idempotency-request-in-progress with a Retry-After header)
          headers:
            Retry-After:
              description: Seconds to wait before retrying, set for idempotency-request-in-progress.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClaimsProblemDetails'
        '413':
          description: Request body above 64 KB
          content:
            application/problem+json:
