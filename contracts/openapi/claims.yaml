components:
  schemas:
    ClaimsAssessedAmountRequest:
      type: object
      required:
        - assessedAmount
      properties:
        assessedAmount:
          type: number
          format: decimal
          minimum: 0.01
        note:
          type: string
          maxLength: 1000
      additionalProperties: false
    ClaimsClaimantClaimView:
      type: object
      required:
        - id
        - claimNumber
        - type
        - market
        - currency
        - status
        - incidentDate
        - description
        - estimatedAmount
        - submittedAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        claimNumber:
          type: string
        type:
          type: string
          enum: [Motor, Property]
        market:
          type: string
          enum: [SG, HK, MY, TH, ID, AU]
        currency:
          type: string
        status:
          type: string
          enum: [Submitted, UnderReview, InfoRequested, PendingDecisionApproval, Approved, Rejected, PendingSettlementApproval, Settling, Settled]
        incidentDate:
          type: string
          format: date
        description:
          type: string
        estimatedAmount:
          type: number
          format: decimal
        approvedAmount:
          type: number
          format: decimal
          nullable: true
        rejectionReason:
          $ref: '#/components/schemas/ClaimsRejectionReason'
          nullable: true
          description: Present only when the claim is Rejected; the wording the checker confirmed.
        submittedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ClaimsClaimantTimelineItem:
      type: object
      required:
        - id
        - occurredAt
        - summary
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        summary:
          type: string
      additionalProperties: false
    ClaimsEmptyRequest:
      type: object
      additionalProperties: false
    ClaimsMotorDetails:
      type: object
      required:
        - vehicleRegistration
        - incidentLocation
      properties:
        vehicleRegistration:
          type: string
          maxLength: 20
        incidentLocation:
          type: string
          maxLength: 200
      additionalProperties: false
    ClaimsOpenProposalView:
      type: object
      required:
        - id
        - outcome
        - rationale
        - makerId
        - proposedAt
      properties:
        id:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [Approve, Reject]
        amount:
          type: number
          format: decimal
          nullable: true
        currency:
          type: string
          nullable: true
        reasonCode:
          type: string
          nullable: true
        rationale:
          type: string
        justification:
          type: string
          nullable: true
        claimantReason:
          type: string
          nullable: true
        makerId:
          type: string
          format: uuid
        proposedAt:
          type: string
          format: date-time
      additionalProperties: false
    ClaimsProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - correlationId
      properties:
        type:
          type: string
          enum: [validation-error, idempotency-key-missing, idempotency-key-invalid, idempotency-key-reused, idempotency-request-in-progress, unauthorized, forbidden, claim-not-found, payload-too-large, server-error, invalid-transition, claim-already-assigned, concurrency-conflict, proposal-pending, proposal-not-open, not-assigned-officer, maker-cannot-check, policy-not-found, market-mismatch, incident-outside-policy-period, incident-date-in-future, currency-mismatch, reason-code-invalid, assessed-amount-required, payable-zero, justification-required, same-officer, phase-2-not-enabled]
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlationId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    ClaimsPropertyDetails:
      type: object
      required:
        - propertyAddress
        - damageType
      properties:
        propertyAddress:
          type: string
          maxLength: 300
        damageType:
          type: string
          maxLength: 100
      additionalProperties: false
    ClaimsProposeDecisionRequest:
      type: object
      required:
        - outcome
        - rationale
      properties:
        outcome:
          type: string
          enum: [Approve, Reject]
        reasonCode:
          type: string
          nullable: true
          enum: [NOT_COVERED, POLICY_INACTIVE, EXCLUSION_APPLIES, INSUFFICIENT_EVIDENCE, DUPLICATE_CLAIM, NO_RESPONSE]
        rationale:
          type: string
          minLength: 10
          maxLength: 2000
        justification:
          type: string
          nullable: true
          maxLength: 2000
        claimantReason:
          type: string
          nullable: true
          minLength: 10
          maxLength: 500
          description: Required for Reject; shown to the claimant after confirmation. The rationale is never shown.
      additionalProperties: false
    ClaimsRejectionReason:
      type: object
      required:
        - code
        - label
        - claimantReason
      properties:
        code:
          type: string
          enum: [NOT_COVERED, POLICY_INACTIVE, EXCLUSION_APPLIES, INSUFFICIENT_EVIDENCE, DUPLICATE_CLAIM, NO_RESPONSE]
        label:
          type: string
        claimantReason:
          type: string
      additionalProperties: false
    ClaimsSendBackRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 1000
      additionalProperties: false
    ClaimsStaffClaimPage:
      type: object
      required:
        - items
        - page
        - pageSize
        - totalCount
      properties:
        items:
