openapi: 3.0.4
info:
  title: Chubb Notification API
  version: v1
paths:
  /notifications:
    get:
      tags:
        - Notifications
      operationId: ListNotifications
      description: Claimant, own Public alerts. Manager, manager alerts. Newest first.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotificationProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /notifications/{id}/read:
    post:
      tags:
        - Notifications
      operationId: MarkNotificationRead
      description: Marks one notification read. Repeating the call has no further effect.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/NotificationProblemDetails'
components:
  schemas:
    NotificationProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        correlationId:
          type: string
          nullable: true
    NotificationView:
      required:
        - id
        - kind
        - claimId
        - message
        - createdAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - ClaimAssigned
            - DecisionAwaitsCheck
            - ClaimApproved
            - ClaimRejected
        claimId:
          type: string
          format: uuid
        message:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
    NotificationPage:
      required:
        - items
        - page
        - pageSize
        - total
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationView'
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        total:
          type: integer
          format: int32
