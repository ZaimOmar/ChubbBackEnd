openapi: 3.0.4
info:
  title: Chubb Reporting API
  version: v1
paths:
  /dashboard/outstanding:
    get:
      operationId: GetOutstandingDashboard
      summary: Outstanding claims by status, market and type (Manager)
      tags:
        - Reporting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingOutstandingView'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
        '403':
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
  /dashboard/exposure:
    get:
      operationId: GetExposureDashboard
      summary: Liability exposure in USD by market and type (Manager)
      tags:
        - Reporting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingExposureView'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
        '403':
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
  /dashboard/pending-approvals:
    get:
      operationId: GetPendingApprovals
      summary: Checker queue, oldest proposal first (Manager)
      tags:
        - Reporting
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportingPendingApprovalPageView'
        '400':
          description: Invalid paging parameters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
        '403':
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
  /staff/workload:
    get:
      operationId: GetStaffWorkload
      summary: 'Open claims per officer by status with ageing (Officer: own, Manager: all)'
      tags:
        - Reporting
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportingOfficerWorkloadView'
        '401':
          description: Missing, expired or invalid token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
        '403':
          description: The caller's role does not allow this
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ReportingProblemDetails'
components:
  schemas:
    ReportingCountView:
      type: object
      required:
        - key
        - count
      properties:
        key:
          type: string
        count:
          type: integer
          format: int32
      additionalProperties: false
    ReportingOldestUnassignedView:
      type: object
      required:
        - claimId
        - claimNumber
        - market
        - type
        - submittedAt
        - ageHours
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        market:
          type: string
        type:
          type: string
        submittedAt:
          type: string
          format: date-time
        ageHours:
          type: number
          format: double
      additionalProperties: false
    ReportingOutstandingView:
      type: object
      required:
        - total
        - awaitingChecker
        - byStatus
        - byMarket
        - byType
        - unassignedCount
      properties:
        total:
          type: integer
          format: int32
        awaitingChecker:
          type: integer
          format: int32
        byStatus:
          type: array
          items:
            $ref: '#/components/schemas/ReportingCountView'
        byMarket:
          type: array
          items:
            $ref: '#/components/schemas/ReportingCountView'
        byType:
          type: array
          items:
            $ref: '#/components/schemas/ReportingCountView'
        unassignedCount:
          type: integer
          format: int32
        oldestUnassigned:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ReportingOldestUnassignedView'
      additionalProperties: false
    ReportingExposureRowView:
      type: object
      required:
        - market
        - type
        - claimCount
        - exposureUsd
      properties:
        market:
          type: string
        type:
          type: string
        claimCount:
          type: integer
          format: int32
        exposureUsd:
          type: number
          format: decimal
      additionalProperties: false
    ReportingExposureView:
      type: object
      required:
        - currency
        - fxAsOf
        - totalUsd
        - rows
      properties:
        currency:
          type: string
        fxAsOf:
          type: string
          format: date
        totalUsd:
          type: number
          format: decimal
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReportingExposureRowView'
      additionalProperties: false
    ReportingPendingApprovalView:
      type: object
      required:
        - claimId
        - claimNumber
        - market
        - type
        - currency
        - makerId
        - makerName
        - proposedAt
        - ageHours
      properties:
        claimId:
          type: string
          format: uuid
        claimNumber:
          type: string
        market:
          type: string
        type:
          type: string
        amount:
          type: number
          format: decimal
          nullable: true
        currency:
          type: string
        makerId:
          type: string
          format: uuid
        makerName:
          type: string
          description: Display name, or the short maker id when the name is unknown.
        proposedAt:
          type: string
          format: date-time
        ageHours:
          type: number
          format: double
      additionalProperties: false
    ReportingPendingApprovalPageView:
      type: object
      required:
        - page
        - pageSize
        - totalCount
        - items
      properties:
        page:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReportingPendingApprovalView'
      additionalProperties: false
    ReportingWorkloadStatusView:
      type: object
      required:
        - status
        - waitingOnChecker
        - count
        - oldestAgeDays
      properties:
        status:
          type: string
        waitingOnChecker:
          type: boolean
        count:
          type: integer
          format: int32
        oldestAgeDays:
          type: integer
          format: int32
      additionalProperties: false
    ReportingOfficerWorkloadView:
      type: object
      required:
        - officerId
        - officerName
        - openCount
        - byStatus
      properties:
        officerId:
          type: string
          format: uuid
        officerName:
          type: string
          description: Display name, or the short officer id when the name is unknown.
        openCount:
          type: integer
          format: int32
        byStatus:
          type: array
          items:
            $ref: '#/components/schemas/ReportingWorkloadStatusView'
      additionalProperties: false
    ReportingProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - correlationId
      properties:
        type:
          type: string
          enum: [validation-error, unauthorized, forbidden, server-error]
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        correlationId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
