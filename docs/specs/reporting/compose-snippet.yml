# Block for docker-compose.yml under `services:` (mirrors `claims`). Not applied by the Reporting agent.
# Requires the `kafka` and `kafka-init` services (kafka-init creates claims.events and claims.events.dlq).
# Gateway: nothing to change. The `reporting` cluster and the /dashboard and /staff routes already exist, and
# contracts/openapi/reporting.yaml merges into /openapi/v1.json (paths and components.schemas, prefix Reporting).
# Optionally add `reporting` to the gateway depends_on (service_healthy) if the demo should wait for it.

  reporting:
    build:
      context: .
      dockerfile: src/Reporting/Dockerfile
    <<: *hardening
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Built from the same variable that creates the role, so the two cannot drift apart.
      ConnectionStrings__ReportingDb: Host=postgres;Port=5432;Database=reporting_db;Username=reporting;Password=${REPORTING_DB_PASSWORD:-dev-only-reporting-db}
      Jwt__Issuer: ${Jwt__Issuer:-chubb-identity}
      Jwt__Audience: ${Jwt__Audience:-chubb-claims-api}
      Jwt__PublicKeyPath: ${Jwt__PublicKeyPath:-/run/jwt-public/public.pem}
      Kafka__BootstrapServers: ${Kafka__BootstrapServers:-kafka:9092}
    # No published port: only the gateway (edge), postgres and kafka (data) can reach it.
    networks: [edge, data]
    depends_on:
      jwt-keys:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - jwt-public:/run/jwt-public:ro
    healthcheck: *dotnet-healthcheck
    restart: unless-stopped
